name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src scripts tests

      - name: Ruff format check
        run: ruff format --check src scripts tests

      - name: mypy
        run: mypy src

      - name: pytest
        run: pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t sentinel-monitoring:ci .

      - name: Run container and smoke-test endpoints
        run: |
          docker run -d --rm --name sentinel-ci -p 8020:8020 sentinel-monitoring:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8020/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8020/health
          curl -sf http://localhost:8020/readyz
          curl -sf -X POST http://localhost:8020/v1/analyze \
            -H "Content-Type: application/json" \
            -d '{"values":[100,102,101,105,103,107,104,108,106,110,300,109,111,108,112],"forecast_horizon":5}'
          docker stop sentinel-ci
