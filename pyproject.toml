[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-monitoring"
version = "0.1.0"
description = "Anomaly-aware forecasting and monitoring: statistical (moving-average/trend) and TensorFlow forecasters, Z-score/CUSUM anomaly detection, and drift-triggered threshold recalibration, served over FastAPI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    # Pinned exactly: a committed trained Keras model (models/tf_forecaster.keras)
    # must load under the same TensorFlow version that saved it — an
    # unpinned floor bound risks a fresh install resolving a newer/older
    # TF whose SavedModel/Keras format compatibility isn't guaranteed.
    "tensorflow==2.21.0",
    "matplotlib>=3.8",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "prometheus-fastapi-instrumentator>=7.0",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["sentinel"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
ignore_missing_imports = true
